<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competidores — prototipo</title>
<style>
/* Tokens reales de app/globals.css (dirección B "Radar"). Hex del comentario de cada token. */
:root, [data-theme="light"] {
  --background:#F5F5FA; --foreground:#14162B; --card:#FFFFFF;
  --primary:#5B3FE6; --primary-subtle:#EFECFF; --primary-text:#5035D6; --primary-border:#D8D0FF;
  --secondary:#F1F1F8; --muted-foreground:#484C69; --subtle-foreground:#5C6082;
  --border:#E2E2EE; --border-hover:#CFCFE0; --input:#86889F;
  --success-foreground:#067647; --success-subtle:#E8F8EF; --success-border:#BDE8CF;
  --warning-foreground:#A15C07; --warning-subtle:#FEF5E1; --warning-border:#F6DDA6;
  --danger-foreground:#B42318; --danger-subtle:#FEF0EF; --danger-border:#F9C9C4;
  --elev:0 1px 2px rgb(20 22 43 / .05), 0 8px 24px -12px rgb(20 22 43 / .10);
  --elev-hover:0 1px 2px rgb(20 22 43 / .06), 0 16px 32px -12px rgb(20 22 43 / .16);
}
[data-theme="dark"] {
  --background:#080A15; --foreground:#F1F2FA; --card:#10132A;
  --primary:#6B4EFF; --primary-subtle:#231F4F; --primary-text:#B3A6FF; --primary-border:#3B3380;
  --secondary:#161A34; --muted-foreground:#B3B8D6; --subtle-foreground:#9096BA;
  --border:#262B4B; --border-hover:#3A4170; --input:#5E6590;
  --success-foreground:#5EE3AB; --success-subtle:#0D2A28; --success-border:#17463F;
  --warning-foreground:#FCD04F; --warning-subtle:#2C2415; --warning-border:#4B3C17;
  --danger-foreground:#FCA5A5; --danger-subtle:#331A26; --danger-border:#57283A;
  --elev:none; --elev-hover:none;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--background); color:var(--foreground); font:14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
.display { font-family: Outfit, Inter, ui-sans-serif, system-ui, sans-serif; }
.ease { transition: box-shadow 200ms cubic-bezier(.2,0,0,1), background-color 160ms cubic-bezier(.2,0,0,1), border-color 160ms cubic-bezier(.2,0,0,1); }
[data-motion="reduce"] .ease, [data-motion="reduce"] .pulse { transition:none !important; animation:none !important; }

.bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--border); font-size:12px; }
.bar b { margin-right:4px; } .bar button { font:inherit; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--foreground); cursor:pointer; }
.bar button[aria-pressed="true"] { background:var(--primary); border-color:var(--primary); color:#fff; }
.sample { margin-left:auto; padding:2px 8px; border-radius:999px; background:var(--warning-subtle); color:var(--warning-foreground); border:1px solid var(--warning-border); font-weight:600; }

.page { max-width:1180px; margin:0 auto; padding:24px 16px 64px; display:grid; grid-template-columns:minmax(0,1fr); gap:20px; }
h1 { margin:0; font-size:24px; font-weight:600; } .lead { margin:4px 0 0; color:var(--muted-foreground); }
.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; color:var(--muted-foreground); }
.toolbar .cta { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:12px; }
.btn { font:inherit; font-weight:600; border-radius:10px; padding:8px 14px; border:1px solid transparent; cursor:pointer; }
.btn-brand { background:var(--primary); color:#fff; } .btn-brand[disabled] { opacity:.5; cursor:not-allowed; }
.btn-outline { background:var(--card); color:var(--foreground); border-color:var(--border-hover); }
.alert { border-radius:12px; border:1px solid var(--danger-border); background:var(--danger-subtle); color:var(--danger-foreground); padding:12px 16px; }
a { color:var(--primary-text); text-decoration:none; } a:hover { text-decoration:underline; }

.grid { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
@media (min-width:768px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1280px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }

/* La tarjeta. La clave del arreglo: una sola columna minmax(0,1fr), así ningún título largo la ensancha. */
.card { display:grid; grid-template-columns:minmax(0,1fr); align-content:start; gap:16px; padding:16px; border-radius:12px; border:1px solid var(--border); background:var(--card); box-shadow:var(--elev); }
.card:hover { box-shadow:var(--elev-hover); }
.head { display:flex; align-items:flex-start; gap:12px; }
.avatar { display:grid; place-items:center; width:36px; height:36px; flex-shrink:0; border-radius:8px; background:var(--primary-subtle); color:var(--primary-text); font-weight:600; text-transform:uppercase; }
.min0 { min-width:0; flex:1; } .trunc { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.name { display:block; font-weight:600; color:var(--foreground); } .meta { font-size:12px; color:var(--subtle-foreground); }
.badge { white-space:nowrap; border-radius:999px; border:1px solid; padding:2px 8px; font-size:12px; font-weight:600; }
.b-warn { border-color:var(--warning-border); background:var(--warning-subtle); color:var(--warning-foreground); }
.b-bad { border-color:var(--danger-border); background:var(--danger-subtle); color:var(--danger-foreground); }
.b-none { border-color:var(--border); background:var(--secondary); color:var(--muted-foreground); }
.b-up { border-color:var(--success-border); background:var(--success-subtle); color:var(--success-foreground); }
.b-flat { border-color:var(--border); background:var(--secondary); color:var(--muted-foreground); }
.dots { width:32px; height:32px; margin:-4px -8px 0 0; border:0; border-radius:8px; background:none; color:var(--muted-foreground); cursor:pointer; font-size:18px; line-height:1; }
.dots:hover { background:var(--secondary); }

.stat { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.num { font-size:30px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; } .cap { margin-top:4px; font-size:12px; color:var(--subtle-foreground); }
.weeks { display:grid; justify-items:end; gap:4px; margin:0; } .weeks figcaption { font-size:11px; color:var(--subtle-foreground); }
.bars { display:flex; align-items:flex-end; gap:4px; height:32px; } .bars span { width:14px; border-radius:3px; background:var(--input); } .bars span:last-child { background:var(--primary); }

.best { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:12px; padding:10px 12px 10px 10px; border-radius:10px; border:1px solid var(--border); background:color-mix(in srgb, var(--secondary) 40%, transparent); color:inherit; }
.best:hover { text-decoration:none; border-color:var(--border-hover); background:var(--secondary); }
.thumb { width:44px; height:44px; border-radius:8px; background:var(--secondary); }
.best .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.best .lbl { font-size:11px; font-weight:500; color:var(--subtle-foreground); }
.best .title { margin-top:2px; font-weight:500; line-height:1.35; color:var(--foreground); overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.empty-best { border:1px dashed var(--border); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--subtle-foreground); }

.foot { display:grid; gap:6px; padding-top:12px; border-top:1px solid var(--border); font-size:12px; }
.foot .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.ads { color:var(--muted-foreground); font-variant-numeric:tabular-nums; } .quiet { color:var(--danger-foreground); }
.go { font-weight:600; white-space:nowrap; }

.skel { height:250px; border-radius:12px; background:var(--secondary); }
.pulse { animation:pulse 1.6s cubic-bezier(.2,0,0,1) infinite; } @keyframes pulse { 50% { opacity:.55; } }
.state-box { display:grid; justify-items:center; gap:12px; padding:56px 24px; border:1px dashed var(--border); border-radius:12px; text-align:center; }
.state-box p { margin:0; max-width:380px; color:var(--muted-foreground); } .state-box strong { color:var(--foreground); }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Controles del prototipo">
  <b>Estado</b>
  <button data-state="datos" aria-pressed="true">Con datos</button>
  <button data-state="vacio" aria-pressed="false">Vacío</button>
  <button data-state="cargando" aria-pressed="false">Cargando</button>
  <button data-state="error" aria-pressed="false">Error</button>
  <button data-state="limite" aria-pressed="false">Límite del plan</button>
  <b style="margin-left:8px">Tema</b>
  <button data-theme-btn="light" aria-pressed="true">Claro</button>
  <button data-theme-btn="dark" aria-pressed="false">Oscuro</button>
  <button id="motion" aria-pressed="false">Movimiento reducido</button>
  <span class="sample">Datos de ejemplo</span>
</div>

<main class="page">
  <header>
    <h1 class="display">Competidores</h1>
    <p class="lead">Las tiendas Shopify que sigues y lo que están lanzando.</p>
  </header>
  <div class="toolbar">
    <span id="count"><strong style="color:var(--foreground)">8 de 15</strong> tiendas en tu plan</span>
    <div class="cta"><span id="limit" hidden>Llegaste al límite. <a href="#planes">Ver planes</a></span><button class="btn btn-brand" id="add">+ Seguir tienda</button></div>
  </div>
  <div id="quiet" class="alert"><strong>2 tiendas están quietas.</strong> Estás usando 2 cupos en tiendas que casi no se mueven.</div>
  <section id="content" aria-live="polite"></section>
</main>

<script>
// Datos de ejemplo: nombres y títulos inventados. Reproducen el caso de producción del 2026-10-13
// (títulos largos con emojis y tiendas que lanzan mucho marcadas "Inactiva" por el backend).
const STORES = [
  { n:'moda-oriente', meta:'China · GBP · Pago anticipado', fresh:21, weeks:[6,9,14,21], best:'⏳LAST DAY SALE ONLY £13.99!!🔥✨ Timeless Comfort Wide Leg Trousers for Women – Breathable', sig:['Creciendo','b-up'], ads:7 },
  { n:'gadget-norte', meta:'Estados Unidos · USD · Pago anticipado', fresh:29, weeks:[4,8,12,29], best:'16 Pcs Interchangeable Welcome Sign for Front Door with Seasonal Icons', sig:['Estable','b-flat'], ads:2, note:'El backend la marca "Inactiva": lanzó 29 productos esta semana, así que no se muestra como quieta.' },
  { n:'brit-deals', meta:'Reino Unido · GBP · Pago anticipado', fresh:28, weeks:[3,2,10,28], best:'🎁💥LAST DAY SPECIAL PRICE!- £7.99!!✨Ice-Cooling Hat for Summer Walks', sig:['Estable','b-flat'], ads:13 },
  { n:'casa-estilo', meta:'Colombia · COP', fresh:2, weeks:[1,0,1,2], best:'✨ Tablero LED + Kit de Dibujo Completo para Niños con 48 Accesorios', sig:['Estable','b-flat'], ads:0, tier:['Moderada','b-warn'] },
  { n:'la-mejor-oferta', meta:'Colombia · COP', fresh:1, weeks:[2,1,1,1], best:'Billetera Antirrobo con Escudo RFID: Tu plata a salvo de los ladrones', sig:['Estable','b-flat'], ads:0 },
  { n:'nutri-plus', meta:'Colombia · COP', fresh:0, weeks:[1,2,2,0], best:'Colágeno Marino Hidrolizado + Biotina y Vitamina C – 60 cápsulas', sig:['Estable','b-flat'], ads:0 },
  { n:'viral-shop', meta:'Colombia · COP', fresh:0, weeks:[1,1,0,0], best:'Faja Reductora Invisible', sig:['Creciendo','b-up'], ads:1, tier:['Inactiva','b-bad'], quiet:true },
  { n:'tienda-dormida', meta:'Colombia · COP', fresh:0, weeks:[0,0,0,0], best:null, ads:0, tier:['Sin movimiento','b-bad'], quiet:true },
  { n:'pausada-ejemplo', meta:'Colombia · COP', fresh:0, weeks:[0,0,0,0], best:null, ads:0, tier:['Pausada','b-none'] },
]
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
function card(s) {
  const max = Math.max(1, ...s.weeks)
  const ads = s.ads === 0 ? 'Sin anuncios activos' : s.ads === 1 ? '1 anuncio activo' : `${s.ads} anuncios activos`
  return `<article class="card ease"${s.note ? ` title="${esc(s.note)}"` : ''}>
    <div class="head">
      <span class="avatar display" aria-hidden="true">${s.n[0]}</span>
      <div class="min0"><a class="name trunc" href="#tienda">${esc(s.n)}</a><div class="meta trunc">${esc(s.meta)}</div></div>
      ${s.tier ? `<span class="badge ${s.tier[1]}">${s.tier[0]}</span>` : ''}
      <button class="dots" aria-label="Opciones de ${esc(s.n)}">⋮</button>
    </div>
    <div class="stat">
      <div><div class="num display">${s.fresh}</div><div class="cap">${s.fresh === 1 ? 'producto nuevo' : 'productos nuevos'} en 7 días</div></div>
      <figure class="weeks"><div class="bars" role="img" aria-label="Productos nuevos por semana, de hace 4 semanas a esta: ${s.weeks.join(', ')}">${s.weeks.map((w) => `<span style="height:${4 + (w / max) * 28}px"></span>`).join('')}</div><figcaption>últimas 4 semanas</figcaption></figure>
    </div>
    ${s.best ? `<a class="best ease" href="#producto"><span class="thumb" aria-hidden="true"></span><span class="min0"><span class="row"><span class="lbl">Su mejor producto ahora</span><span class="badge ${s.sig[1]}">${s.sig[0]}</span></span><span class="title">${esc(s.best)}</span></span></a>`
      : `<p class="empty-best" style="margin:0">Todavía no hay productos en seguimiento de esta tienda.</p>`}
    <div class="foot"><div class="row"><span class="ads">${ads}</span><a class="go" href="#tienda" aria-label="Ver tienda ${esc(s.n)}">Ver tienda →</a></div>${s.quiet ? '<span class="quiet">Está quieta: considera liberar este cupo.</span>' : ''}</div>
  </article>`
}
const content = document.getElementById('content')
function render(state) {
  document.getElementById('quiet').hidden = !(state === 'datos' || state === 'limite')
  document.getElementById('limit').hidden = state !== 'limite'
  document.getElementById('add').disabled = state === 'limite'
  document.getElementById('count').innerHTML = state === 'limite' ? '<strong style="color:var(--foreground)">15 de 15</strong> tiendas en tu plan'
    : state === 'datos' ? '<strong style="color:var(--foreground)">8 de 15</strong> tiendas en tu plan' : state === 'vacio' ? '<strong style="color:var(--foreground)">0 de 15</strong> tiendas en tu plan' : ''
  if (state === 'cargando') content.innerHTML = `<div class="grid">${'<div class="skel pulse"></div>'.repeat(3)}</div>`
  else if (state === 'vacio') content.innerHTML = `<div class="state-box"><strong>Todavía no sigues ninguna tienda</strong><p>Pega el link de una tienda Shopify de tu competencia. Desde el próximo corte verás aquí qué lanza y qué le funciona.</p><button class="btn btn-outline">+ Seguir la primera tienda</button></div>`
  else if (state === 'error') content.innerHTML = `<div class="state-box" role="alert"><strong>No pudimos cargar tus tiendas</strong><p>Tus tiendas siguen ahí: fue un problema al traerlas. Prueba de nuevo en un momento.</p><button class="btn btn-outline">Reintentar</button></div>`
  else content.innerHTML = `<div class="grid">${STORES.map(card).join('')}</div><p class="meta" style="margin-top:16px">Las tiendas pausadas no usan cupo.</p>`
}
document.querySelectorAll('[data-state]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-state]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
  render(b.dataset.state)
}))
document.querySelectorAll('[data-theme-btn]').forEach((b) => b.addEventListener('click', () => {
  document.documentElement.dataset.theme = b.dataset.themeBtn
  document.querySelectorAll('[data-theme-btn]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
}))
document.getElementById('motion').addEventListener('click', (e) => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'
  e.currentTarget.setAttribute('aria-pressed', String(on))
  document.documentElement.dataset.motion = on ? 'reduce' : ''
})
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('motion').click()
render('datos')
</script>
</body>
</html>
